# =============================================================================
#  ExcelPatientDicomExportMG  –  settings.example.ini
#
#  Kopiere diese Datei nach settings.ini (im selben Ordner wie die .exe)
#  und passe alle site-spezifischen Werte an deine Umgebung an.
#  Copy this file to settings.ini (same folder as the .exe)
#  and adapt all site-specific values to your environment.
#
#  Das Programm schreibt settings.ini beim Start automatisch zurück,
#  sobald Änderungen im Optionsfenster bestätigt werden.
# =============================================================================


# -----------------------------------------------------------------------------
#  DICOM-Kommunikation / DICOM communication
#
#  Die DICOM-Übertragung nutzt DCMTK movescu als Kommunikations-Layer.
#  Alternativ sind auch andere DICOM-Toolkits möglich (z.B. fo-dicom,
#  pynetdicom, dcm4che), solange sie einen C-MOVE-SCU bereitstellen.
#  Weitere Infos zum ARIA DICOM DB Daemon:
#    https://github.com/VarianAPIs/Varian-Code-Samples/wiki/Scripting-the-Varian-DICOM-DB-Daemon-with-ESAPI
#    https://varianapis.github.io/VarianApiBook.pdf  (Kapitel 4)
#
#  AET  = AE Title des lokalen movescu-Clients (muss im ARIA-Daemon eingetragen sein)
#  AEC  = AE Title des ARIA DICOM DB Daemon (Called AE)
#  AEM  = AE Title des Storage-SCP, an den ARIA die Dateien sendet (Move Destination)
# -----------------------------------------------------------------------------
AET=DCMTK
AEC=DICOM_ESAPI
AEM=ScriptExport

# IP-Adresse oder Hostname des ARIA DB-Servers
DICOM_HOST=192.0.2.10

# DICOM-Port des ARIA DB Daemon (typisch 51402 oder ein site-spezifischer Wert)
DICOM_PORT=51402

# UNC-Pfad des Storage-SCP-Drop-Ordners (SCRIPTEXPORT / ScriptExport-Freigabe auf dem ARIA-Server)
# Dieser Ordner muss vom Skript-Rechner aus schreibbar / lesbar sein.
ESAPI_IMPORT_BASE=\\YOUR_ARIA_SERVER\DICOM_ESAPI_ScriptExport

# Pfade zu DCMTK-Binaries (Semikolon-getrennt, erster existierender Pfad wird genutzt).
# Option A: Assets\DCMTK.zip entpacken nach Assets\DCMTK\  → Assets\DCMTK\bin\movescu.exe
# Option B: DCMTK systemweit installieren, z.B. C:\dcmtk\bin
DCMTK_PATHS=Assets\DCMTK\bin;C:\dcmtk\bin

# TRUE  = ARIA legt exportierte Dateien in einen Patientenunterordner ab:
#           ESAPI_IMPORT_BASE\<PatientId>\...
# FALSE = ARIA legt alle Dateien direkt in ESAPI_IMPORT_BASE ab
SCRIPTEXPORT_USES_PATIENT_SUBFOLDER=FALSE

# Millisekunden nach movescu bevor auf neue Dateien gewartet wird (normalerweise 2000 ms)
SCRIPTEXPORT_WRITE_WAIT_MS=2000


# -----------------------------------------------------------------------------
#  Ausgabe / Output
# -----------------------------------------------------------------------------

# Basis-Export-Ordner; hier werden Patientenunterordner angelegt.
EXPORT_BASE=C:\DICOM_Export

# Standard-Startverzeichnis für den "Excel-Datei auswählen"-Dialog
EXCEL_INITIAL_DIRECTORY=C:\

# Zuletzt verwendete Excel-Datei (wird beim Start automatisch aktualisiert)
LAST_EXCEL_FILE=

# Spalte mit Patient-IDs im Excel (1 = Spalte A, 2 = Spalte B, ...)
EXCEL_ID_COLUMN=1

# Erste Datenzeile im Excel (2 = erste Zeile nach Header)
EXCEL_START_ROW=2


# -----------------------------------------------------------------------------
#  Export-Schalter / Export toggles
# -----------------------------------------------------------------------------

# CBCT-Serien exportieren (erkennt StructureSets mit "kV" oder "CBCT" im Namen)
EXPORT_CBCT=FALSE

# Portal-Dosisbilder exportieren (RTIMAGE mit ImageType ACQUIRED_DOSE)
EXPORT_ACQUIRED_DOSE_RTIMAGE=TRUE

# Plan-Sets exportieren (CT, RTSTRUCT, RTPLAN, RTDOSE)
EXPORT_PLAN_SETS=TRUE

# -- Plan-Set-Unterschalter (nur aktiv wenn EXPORT_PLAN_SETS=TRUE) --
EXPORT_CT=TRUE
EXPORT_RTSTRUCT=TRUE
EXPORT_RTPLAN=TRUE
EXPORT_RTDOSE=TRUE

# Nur behandelte Pläne (plan.IsTreated = TRUE) exportieren
ONLY_TREATED_PLANS=TRUE


# -----------------------------------------------------------------------------
#  Debug / Laufzeitoptionen
# -----------------------------------------------------------------------------

# TRUE = Lauf nach DEBUG_MAX_PATIENTS Patienten abbrechen (Test-Modus)
DEBUG_LIMIT_ENABLED=FALSE

# Anzahl Patienten im Debug-Modus (nur aktiv wenn DEBUG_LIMIT_ENABLED=TRUE)
DEBUG_MAX_PATIENTS=5

# Timeout für einen movescu-Aufruf in Millisekunden (Standard: 180 s)
MOVESCU_TIMEOUT_MS=180000

# TRUE = movescu stdout vollständig ausgeben (gesprächig)
VERBOSE_MOVESCU_OUTPUT=FALSE

# TRUE = Konsolenfenster am Ende offen halten (Warte auf Tastendruck)
PAUSE_AT_END=TRUE
